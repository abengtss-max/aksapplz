# CD Template - Reusable workflow for Continuous Deployment
# Uses GitHub environment protection rules for approval gates
# Plan job runs first, then Apply job requires team approval via the apply environment
name: "CD Template"

on:
  workflow_call:
    inputs:
      plan_environment:
        required: true
        type: string
        description: "GitHub environment for plan (OIDC auth)"
      apply_environment:
        required: true
        type: string
        description: "GitHub environment for apply (OIDC auth + approval gate)"
      action:
        required: false
        type: string
        default: "apply"
        description: "Action to perform: apply or destroy"
      terraform_version:
        required: false
        type: string
        default: "~> 1.12.0"
        description: "Terraform version to install"
      working_directory:
        required: false
        type: string
        default: "terraform"
        description: "Working directory for Terraform commands (workload TF lives under /terraform)."
      runner_label:
        required: false
        type: string
        default: "self-hosted"
        description: "Runner label: 'self-hosted' (ACI runner) or 'ubuntu-latest' (GitHub-hosted)"
      backend_key:
        required: false
        type: string
        default: "aks-landing-zone.tfstate"
        description: "Object key inside the state container (must match CI so plan/apply share state)."

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ${{ inputs.runner_label }}
    environment: ${{ inputs.plan_environment }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      # Force Go's HTTP/1.1 client for provider downloads to avoid transient
      # HTTP/2 "connection error: PROTOCOL_ERROR" from release-assets.githubusercontent.com.
      GODEBUG: http2client=0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: |
          init() {
            terraform init \
              -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
              -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
              -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
              -backend-config="key=${{ inputs.backend_key }}" \
              -backend-config="use_oidc=true" \
              -backend-config="use_azuread_auth=true"
          }
          for attempt in 1 2 3; do
            init && exit 0
            echo "terraform init failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Terraform Plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            echo "::warning::DESTROY selected — generating a plan to TEAR DOWN all managed infrastructure."
            terraform plan -destroy -out=tfplan -input=false
          else
            echo "::notice::APPLY selected — generating a plan to create/update infrastructure."
            terraform plan -out=tfplan -input=false
          fi

      - name: Plan Summary
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            echo "## Terraform DESTROY Plan :warning:" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Terraform Apply Plan" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform show tfplan -no-color | tail -30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1

  apply:
    name: "Terraform Apply"
    runs-on: ${{ inputs.runner_label }}
    needs: plan
    environment: ${{ inputs.apply_environment }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      # Force Go's HTTP/1.1 client for provider downloads to avoid transient
      # HTTP/2 "connection error: PROTOCOL_ERROR" from release-assets.githubusercontent.com.
      GODEBUG: http2client=0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: |
          init() {
            terraform init \
              -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
              -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
              -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
              -backend-config="key=${{ inputs.backend_key }}" \
              -backend-config="use_oidc=true" \
              -backend-config="use_azuread_auth=true"
          }
          for attempt in 1 2 3; do
            init && exit 0
            echo "terraform init failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ inputs.working_directory }}

      - name: ${{ inputs.action == 'destroy' && 'Terraform Destroy' || 'Terraform Apply' }}
        run: |
          # Applies the saved plan. For a destroy plan this tears down infrastructure;
          # Terraform still prints "Apply complete!" because it is applying a saved plan.
          terraform apply -auto-approve -input=false tfplan

      - name: Apply Summary
        if: success()
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            echo "## Terraform Destroy Complete :white_check_mark:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Infrastructure has been successfully torn down." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Terraform Apply Complete :white_check_mark:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Infrastructure has been successfully deployed." >> $GITHUB_STEP_SUMMARY
          fi

      # ---------------------------------------------------------------------
      # App Gateway -> AKS ingress auto-wire (no AGIC / no AGC).
      # When ingress_controller is 'istio' or 'traefik', deploy/use the internal
      # ingress controller, discover its live internal load balancer IP (no
      # hard-coded IP), and set it on the App Gateway backend pool. Every step
      # is best-effort: a successful apply is never failed by wiring issues.
      # ---------------------------------------------------------------------
      - name: Azure login (ingress wiring)
        if: success() && inputs.action != 'destroy'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Wire ingress controller into App Gateway
        if: success() && inputs.action != 'destroy'
        run: |
          set -euo pipefail
          CONTROLLER="$(terraform output -raw ingress_controller 2>/dev/null || echo manual)"
          APPGW="$(terraform output -raw app_gateway_name 2>/dev/null || echo '')"
          if [ "$CONTROLLER" = "manual" ] || [ -z "$CONTROLLER" ]; then
            echo "::notice::ingress_controller=manual - skipping backend auto-wire."
            terraform output -raw ingress_next_steps 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi
          if [ -z "$APPGW" ] || [ "$APPGW" = "null" ]; then
            echo "::notice::App Gateway not enabled - nothing to wire."
            exit 0
          fi
          RG="$(terraform output -raw resource_group_name)"
          AKS="$(terraform output -raw aks_cluster_name)"
          POOL="$(terraform output -raw app_gateway_backend_pool_name)"

          if [ "$CONTROLLER" = "traefik" ]; then
            echo "::notice::Deploying Traefik (internal LoadBalancer) into $AKS ..."
            # NOTE: a multi-line script passed inline via 'az aks command invoke
            # --command' is unreliable - only the first line reliably executes, which
            # previously left Traefik uninstalled and the App Gateway wiring stuck on
            # "internal LB IP not ready". Write the script to a file and upload it with
            # --file so the whole thing runs verbatim on the cluster.
            cat > traefik-install.sh <<'EOS'
          helm repo add traefik https://traefik.github.io/charts >/dev/null 2>&1 || true
          helm repo update >/dev/null 2>&1
          helm upgrade --install traefik traefik/traefik \
            --namespace traefik --create-namespace \
            --set service.type=LoadBalancer \
            --set-string service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-internal"=true \
            --wait --timeout 5m
          EOS
            az aks command invoke -g "$RG" -n "$AKS" --only-show-errors -o none \
              --command 'bash traefik-install.sh' --file traefik-install.sh \
              || echo "::warning::Traefik install via command invoke reported an error; check the cluster."
            NS=traefik ; SVC=traefik
          else
            NS=aks-istio-ingress ; SVC=aks-istio-ingressgateway-internal
          fi

          echo "::notice::Discovering internal LB IP for svc/$SVC in namespace $NS ..."
          IP=""
          for attempt in $(seq 1 30); do
            RAW="$(az aks command invoke -g "$RG" -n "$AKS" --only-show-errors -o tsv \
              --command "kubectl get svc $SVC -n $NS -o jsonpath='{.status.loadBalancer.ingress[0].ip}'" 2>/dev/null || true)"
            IP="$(echo "$RAW" | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n1 || true)"
            [ -n "$IP" ] && break
            echo "  internal LB IP not ready yet (attempt $attempt/30), waiting 10s..."
            sleep 10
          done

          if [ -z "$IP" ]; then
            echo "::warning::Could not determine the internal ingress LB IP for $CONTROLLER. Apply succeeded; wire backend pool '$POOL' on '$APPGW' manually once the controller has an internal IP."
            exit 0
          fi

          echo "::notice::Internal ingress LB IP = $IP - updating backend pool $POOL on $APPGW ..."
          if az network application-gateway address-pool update \
               -g "$RG" --gateway-name "$APPGW" -n "$POOL" \
               --servers "$IP" --only-show-errors -o none; then
            {
              echo "## Ingress wired :white_check_mark:"
              echo ""
              echo "App Gateway **$APPGW** backend pool **$POOL** now targets **$IP** ($CONTROLLER)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Failed to update the App Gateway backend pool. Set backend pool '$POOL' on '$APPGW' to '$IP' manually."
          fi