# CD Template - Reusable workflow for Continuous Deployment
# Uses GitHub environment protection rules for approval gates
# Plan job runs first, then Apply job requires team approval via the apply environment
name: "CD Template"

on:
  workflow_call:
    inputs:
      plan_environment:
        required: true
        type: string
        description: "GitHub environment for plan (OIDC auth)"
      apply_environment:
        required: true
        type: string
        description: "GitHub environment for apply (OIDC auth + approval gate)"
      action:
        required: false
        type: string
        default: "apply"
        description: "Action to perform: apply or destroy"
      terraform_version:
        required: false
        type: string
        default: "~> 1.12.0"
        description: "Terraform version to install"
      working_directory:
        required: false
        type: string
        default: "terraform"
        description: "Working directory for Terraform commands (workload TF lives under /terraform)."
      runner_label:
        required: false
        type: string
        default: "self-hosted"
        description: "Runner label: 'self-hosted' (ACI runner) or 'ubuntu-latest' (GitHub-hosted)"
      backend_key:
        required: false
        type: string
        default: "aks-landing-zone.tfstate"
        description: "Object key inside the state container (must match CI so plan/apply share state)."

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ${{ inputs.runner_label }}
    environment: ${{ inputs.plan_environment }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      # Force Go's HTTP/1.1 client for provider downloads to avoid transient
      # HTTP/2 "connection error: PROTOCOL_ERROR" from release-assets.githubusercontent.com.
      GODEBUG: http2client=0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: |
          init() {
            terraform init \
              -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
              -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
              -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
              -backend-config="key=${{ inputs.backend_key }}" \
              -backend-config="use_oidc=true" \
              -backend-config="use_azuread_auth=true"
          }
          for attempt in 1 2 3; do
            init && exit 0
            echo "terraform init failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Terraform Plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            echo "::warning::DESTROY selected — generating a plan to TEAR DOWN all managed infrastructure."
            terraform plan -destroy -out=tfplan -input=false
          else
            echo "::notice::APPLY selected — generating a plan to create/update infrastructure."
            terraform plan -out=tfplan -input=false
          fi

      - name: Plan Summary
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            echo "## Terraform DESTROY Plan :warning:" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Terraform Apply Plan" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform show tfplan -no-color | tail -30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1

  apply:
    name: "Terraform Apply"
    runs-on: ${{ inputs.runner_label }}
    needs: plan
    environment: ${{ inputs.apply_environment }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      # Force Go's HTTP/1.1 client for provider downloads to avoid transient
      # HTTP/2 "connection error: PROTOCOL_ERROR" from release-assets.githubusercontent.com.
      GODEBUG: http2client=0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: |
          init() {
            terraform init \
              -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
              -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
              -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
              -backend-config="key=${{ inputs.backend_key }}" \
              -backend-config="use_oidc=true" \
              -backend-config="use_azuread_auth=true"
          }
          for attempt in 1 2 3; do
            init && exit 0
            echo "terraform init failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Download Plan
        if: inputs.action != 'destroy'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ inputs.working_directory }}

      # ---------------------------------------------------------------------
      # Pre-destroy: start any deallocated VM the stack manages.
      #
      # The management jumpbox has an auto-shutdown schedule, so by teardown time
      # its VM is normally deallocated. Terraform destroys the AADSSHLoginForLinux
      # extension (a child of the VM) BEFORE the VM itself, and Azure rejects
      # deleting an extension on a stopped VM ("OperationNotAllowed: Cannot modify
      # extensions in the VM when the VM is not running"), which DETERMINISTICALLY
      # fails `terraform destroy` (it is not a transient error, so the retry loop
      # cannot recover it). Starting the VM first lets the extension delete
      # succeed; the VM is then destroyed normally. Best-effort: never blocks
      # teardown when there is no VM or Azure is unreachable.
      # ---------------------------------------------------------------------
      - name: Azure login (pre-destroy VM start)
        if: inputs.action == 'destroy'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start deallocated VMs before destroy
        if: inputs.action == 'destroy'
        run: |
          set +e
          # The jumpbox lives in the runtime tier (rg-<prefix>-runtime under the
          # default "lifecycle" layout; the single regional RG under "flat").
          RG="$(terraform output -raw runtime_resource_group_name 2>/dev/null || terraform output -raw resource_group_name 2>/dev/null || echo '')"
          if [ -z "$RG" ] || [ "$RG" = "null" ]; then
            echo "::notice::No resource_group_name output resolved; skipping pre-destroy VM start."
            exit 0
          fi
          IDS="$(az vm list -g "$RG" --query '[].id' -o tsv 2>/dev/null)"
          if [ -z "$IDS" ]; then
            echo "::notice::No VMs found in $RG; nothing to start before destroy."
            exit 0
          fi
          echo "::notice::Starting VM(s) in $RG so the jumpbox AAD-login extension can be deleted during destroy ..."
          az vm start --ids $IDS --only-show-errors
          echo "::notice::Pre-destroy VM start finished (or already running); proceeding to destroy."
          exit 0

      - name: ${{ inputs.action == 'destroy' && 'Terraform Destroy' || 'Terraform Apply' }}
        run: |
          # Transient Azure control-plane errors that are SAFE to retry by
          # recomputing from live state (bounded, 3 attempts). These are the
          # well-known fresh full-stack races: AKS agent-pool EtagMismatch /
          # "Another operation is in progress" (aka.ms/aks/aksoperationpreempted),
          # private DNS-zone-group AnotherOperationInProgress during teardown, and
          # ARM throttling (429). A genuine config error does NOT match this
          # filter, so the loop exits immediately and the step fails fast.
          transient='EtagMismatch|[Aa]nother operation .*is in progress|AnotherOperationInProgress|429 Too Many Requests|TooManyRequests|context deadline exceeded'
          if [ "${{ inputs.action }}" = "destroy" ]; then
            # Re-plan-and-destroy against CURRENT state instead of applying the
            # saved destroy plan. A teardown that stops on a transient Azure error
            # (e.g. a 409) changes state, which makes the previously saved plan
            # "stale" and unusable on a re-run ("Saved plan is stale"). Running
            # terraform destroy here recomputes the teardown from live state every
            # time, so re-running the failed job - or a fresh dispatch - always
            # resumes the teardown cleanly and idempotently. The environment
            # approval gate on this job still governs when destroy may proceed.
            set +e
            terraform destroy -auto-approve -input=false 2>&1 | tee tf.log; rc=${PIPESTATUS[0]}
            attempt=1
            while [ "$rc" -ne 0 ] && [ "$attempt" -le 3 ] && grep -Eq "$transient" tf.log; do
              echo "::warning::Transient Azure error during destroy (attempt $attempt/3); retrying from live state in 30s ..."
              sleep 30
              terraform destroy -auto-approve -input=false 2>&1 | tee tf.log; rc=${PIPESTATUS[0]}
              attempt=$((attempt + 1))
            done
            exit "$rc"
          else
            # Apply the EXACT saved plan the approver reviewed (create/update). On a
            # TRANSIENT Azure error the state has already advanced so the saved plan
            # becomes stale; recover by recomputing from live state and re-applying
            # (transient-only, bounded) so a clean deploy no longer needs a manual
            # re-dispatch. The first attempt always applies the approved plan.
            set +e
            terraform apply -auto-approve -input=false tfplan 2>&1 | tee tf.log; rc=${PIPESTATUS[0]}
            attempt=1
            while [ "$rc" -ne 0 ] && [ "$attempt" -le 3 ] && grep -Eq "$transient" tf.log; do
              echo "::warning::Transient Azure error during apply (attempt $attempt/3); recomputing from live state and retrying in 30s - see aka.ms/aks/aksoperationpreempted ..."
              sleep 30
              terraform apply -auto-approve -input=false 2>&1 | tee tf.log; rc=${PIPESTATUS[0]}
              attempt=$((attempt + 1))
            done
            exit "$rc"
          fi

      - name: Apply Summary
        if: success()
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            echo "## Terraform Destroy Complete :white_check_mark:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Infrastructure has been successfully torn down." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Terraform Apply Complete :white_check_mark:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Infrastructure has been successfully deployed." >> $GITHUB_STEP_SUMMARY
          fi

      # ---------------------------------------------------------------------
      # App Gateway -> AKS ingress wiring (no AGIC / no AGC).
      # Only the managed Istio internal ingress gateway is wired automatically:
      # we discover its internal load balancer private IP and set it on the App
      # Gateway backend pool. For any other choice ('manual' / bring-your-own
      # open-source ingress) we deliver the baseline only and hand off to the
      # customer via ingress_next_steps - the pipeline installs nothing. Every
      # step is best-effort: a successful apply is never failed by wiring issues.
      # ---------------------------------------------------------------------
      - name: Azure login (ingress wiring)
        if: success() && inputs.action != 'destroy'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Wire ingress controller into App Gateway
        if: success() && inputs.action != 'destroy'
        run: |
          set -euo pipefail
          CONTROLLER="$(terraform output -raw ingress_controller 2>/dev/null || echo manual)"
          APPGW="$(terraform output -raw app_gateway_name 2>/dev/null || echo '')"

          # Only the managed Istio internal ingress gateway is auto-wired. For any
          # other value (manual / bring-your-own open-source ingress) we deliver the
          # baseline and leave the ingress controller + backend-pool wiring to the
          # customer - no cluster changes are made here.
          if [ "$CONTROLLER" != "istio" ]; then
            echo "::notice::ingress_controller=$CONTROLLER - baseline delivered; install and wire your own ingress controller (see the job summary)."
            terraform output -raw ingress_next_steps 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi
          if [ -z "$APPGW" ] || [ "$APPGW" = "null" ]; then
            echo "::notice::App Gateway not enabled - nothing to wire."
            exit 0
          fi
          # AKS and the App Gateway live in the runtime tier. Under the default
          # "lifecycle" resource_group_layout that is rg-<prefix>-runtime; under
          # "flat" runtime_resource_group_name resolves to the single regional RG.
          # Fall back to resource_group_name for older state without the output.
          RG="$(terraform output -raw runtime_resource_group_name 2>/dev/null || terraform output -raw resource_group_name)"
          AKS="$(terraform output -raw aks_cluster_name)"
          POOL="$(terraform output -raw app_gateway_backend_pool_name)"

          # Discover the Istio internal ingress gateway's LoadBalancer IP inside a
          # SINGLE 'az aks command invoke'. Each invoke pays a ~15-20s command-pod
          # scheduling cost, so we wait for the IP with one in-cluster loop instead
          # of many separate poll invokes. The script prints 'INGRESS_LB_IP=<ip>'.
          cat > ingress-wire.sh <<'EOS'
          set -eo pipefail
          IP=""
          ERR=""
          for i in $(seq 1 36); do
            IP="$(kubectl get svc aks-istio-ingressgateway-internal -n aks-istio-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/tmp/ingress-err.txt || true)"
            if [ -n "$IP" ]; then break; fi
            ERR="$(cat /tmp/ingress-err.txt 2>/dev/null || true)"
            sleep 5
          done
          echo "INGRESS_LB_IP=${IP}"
          if [ -z "$IP" ] && [ -n "$ERR" ]; then echo "INGRESS_LB_ERR=${ERR}"; fi
          EOS

          # Defensively normalise line endings so the uploaded script always runs on
          # the Linux command pod regardless of how the workflow file was checked out.
          sed -i 's/\r$//' ingress-wire.sh

          echo "::notice::Discovering the Istio internal ingress gateway LB IP (svc/aks-istio-ingressgateway-internal in aks-istio-ingress) ..."
          IP=""
          for outer in 1 2; do
            OUT="$(az aks command invoke -g "$RG" -n "$AKS" --only-show-errors -o tsv --command 'bash ingress-wire.sh' --file ingress-wire.sh 2>&1 || true)"
            echo "$OUT"
            IP="$(printf '%s\n' "$OUT" | grep -Eo 'INGRESS_LB_IP=([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n1 | cut -d= -f2 || true)"
            if [ -n "$IP" ]; then break; fi
            ERRLINE="$(printf '%s\n' "$OUT" | grep -E '^INGRESS_LB_ERR=' | head -n1 | cut -d= -f2- || true)"
            if [ -n "$ERRLINE" ]; then echo "::warning::in-cluster kubectl could not read the Istio internal ingress gateway service: $ERRLINE"; fi
            echo "::notice::Istio internal gateway IP not resolved on invoke $outer/2; retrying ..."
          done

          if [ -z "$IP" ]; then
            echo "::warning::Could not determine the Istio internal ingress gateway IP. Apply succeeded; ensure enable_istio_service_mesh=true and istio_internal_ingress_gateway=true, that the deploying identity has an 'Azure Kubernetes Service RBAC Reader' (or higher) role on the cluster (required for 'az aks command invoke' kubectl when Azure RBAC + disabled local accounts are in use), then set backend pool '$POOL' on '$APPGW' to the gateway's private IP."
            exit 0
          fi

          echo "::notice::Istio internal ingress LB IP = $IP - updating backend pool $POOL on $APPGW ..."
          if az network application-gateway address-pool update \
               -g "$RG" --gateway-name "$APPGW" -n "$POOL" \
               --servers "$IP" --only-show-errors -o none; then
            {
              echo "## Ingress wired :white_check_mark:"
              echo ""
              echo "App Gateway **$APPGW** backend pool **$POOL** now targets the Istio internal ingress gateway at **$IP**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Failed to update the App Gateway backend pool. Set backend pool '$POOL' on '$APPGW' to '$IP' manually."
          fi